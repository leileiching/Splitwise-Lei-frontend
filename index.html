<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分帳雷雷好夥伴</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 圓體字型 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <!-- 歡迎畫面 (Landing) -->
        <section id="landing-section" class="section landing-container">
            <div class="landing-card">
                <div class="app-logo">💰</div>
                <h1>雷雷好夥伴<br>分帳小幫手</h1>
                <p class="subtitle">與朋友一起快樂出遊，<br>記帳好方便！</p>
                <button id="go-login-btn" class="btn btn-primary btn-lg">開啟記帳本</button>
            </div>
        </section>

        <!-- 登入畫面 -->
        <section id="login-section" class="section hidden">
            <div class="login-card">
                <button id="back-to-landing" class="btn-icon back-btn">←</button>
                <div class="app-logo small">💰</div>
                <h2>帳本登入</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">使用者名稱</label>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="請輸入帳號">
                    </div>
                    <div class="form-group">
                        <label for="password">通關密碼</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="請輸入密碼">
                    </div>
                    <button type="submit" class="btn btn-primary">解鎖帳本</button>
                    <p id="login-error" class="error-msg"></p>
                </form>
            </div>
        </section>

        <!-- 主畫面 (Dashboard) -->
        <section id="main-section" class="section hidden">
            <header class="header">
                <div class="brand">
                    <span class="app-logo small">💰</span>
                    <span id="welcome-msg">歡迎回來！</span>
                </div>
                <button id="logout-btn" class="btn btn-sm btn-secondary">登出</button>
            </header>

            <!-- 帳戶統計 -->
            <div class="bells-card">
                <div class="budget-main-display" id="budget-section">
                    <span class="label-lg">本趟還能花</span>
                    <div class="amount-hero" id="budget-remaining">$0</div>

                    <div class="progress-bar-bg">
                        <div id="budget-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="budget-meta">
                        <span>總預算: <span id="total-budget">$0</span></span>
                        <span id="budget-percent">0%</span>
                    </div>
                </div>

                <div class="bell-stats">
                    <div class="stat-item income">
                        <span class="label">額外收入</span>
                        <span id="total-income" class="amount">0</span>
                    </div>
                    <div class="stat-item expense">
                        <span class="label">累計支出</span>
                        <span id="total-expense" class="amount">0</span>
                    </div>
                </div>
            </div>

            <!-- 功能按鈕區 -->
            <div class="action-grid">
  <button id="btn-add-transaction" class="action-card income">
    <div class="icon">📝</div>
    記一筆
  </button>

  <button id="btn-manage-category" class="action-card expense">
    <div class="icon">📂</div>
    管理類別
  </button>

  <!-- ⭐ 新增：分帳試算（跨兩欄） -->
  <button id="btn-split-bill" class="action-card split span-2">
    <div class="icon">🧮</div>
    分帳試算
  </button>
</div>


            <!-- 交易紀錄 -->
            <div class="list-container">
                <h3 id="transaction-list-title">11月收支</h3>
                <div id="transaction-list" class="transaction-list">
                    <!-- 動態載入 -->
                </div>
            </div>




        </section>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
